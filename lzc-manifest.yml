application:
  subdomain: moyai
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://moyai:8787/
services:
  moyai:
    # ghcr.io/berriai/moyai:quickstart
    # upstream: ghcr.io/berriai/moyai:quickstart@sha256:12de6a747b177bac6d56e5310d3aee728e72a15a1086eecd0a6476577f75c1ae
    image: ghcr.io/berriai/moyai:quickstart@sha256:12de6a747b177bac6d56e5310d3aee728e72a15a1086eecd0a6476577f75c1ae
    environment:
      - DATA_DIR=/data
      - WORKSPACE_PASSWORD={{ .U.workspace_password }}
      - MOYAI_ADMIN_USER={{ .U.admin_user }}
      - ENCRYPTION_KEY={{ stable_secret "moyai_encryption_key" }}
      - LITELLM_API_BASE={{ .U.litellm_api_base }}
      - LITELLM_API_KEY={{ .U.litellm_api_key }}
      - MOYAI_MODELS={{ .U.moyai_models }}
      - MOYAI_MODEL_CALL_LIMIT=100
      - MOYAI_MODEL_TIMEOUT=300
    binds:
      - /lzcapp/var/data:/data
